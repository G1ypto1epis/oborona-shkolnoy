<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Оборона аэродрома</title><style>
*{box-sizing:border-box;touch-action:none}body{margin:0;overflow:hidden;background:#101e26;color:#eef8fa;font:14px system-ui}canvas{width:100vw;height:100dvh;display:block}button{border:1px solid #7fc5d2;border-radius:10px;background:#173b4a;color:white;font:700 14px system-ui;padding:10px;cursor:pointer}#hud{position:fixed;inset:0;pointer-events:none}.box{position:absolute;background:#0c202de8;border:1px solid #658b92;border-radius:10px;padding:9px;line-height:1.5}#status{top:10px;left:10px;min-width:190px}#objective{top:10px;left:50%;transform:translateX(-50%);text-align:center;max-width:48vw}#actions{right:10px;top:10px;display:flex;gap:5px;pointer-events:auto}#aux{position:absolute;right:18px;bottom:160px;display:flex;gap:6px;pointer-events:auto}.stick{position:absolute;bottom:20px;width:125px;height:125px;border:2px solid #9fd9dc88;border-radius:50%;background:#173e55aa;pointer-events:auto;display:grid;place-items:center}.stick i{width:50px;height:50px;border-radius:50%;background:#6eb9ca;border:2px solid #d5f3ee;pointer-events:none}#move{left:22px}#fire{right:22px;background:#62372aaa;border-color:#e6aa8e}#fire i{background:#da8c65}#message{top:25%;left:50%;transform:translateX(-50%);text-align:center;min-width:180px}#map{position:absolute;right:12px;top:65px;width:150px;height:90px;border:2px solid #9bd4d8;pointer-events:auto;cursor:pointer}#panel{position:fixed;inset:0;display:grid;place-items:center;background:#071721eF;overflow:auto;padding:16px}#panel[hidden]{display:none}.menu{max-width:720px;width:100%;max-height:95dvh;overflow:auto;background:#17303d;padding:20px;border-radius:16px;touch-action:pan-y}.menu p,.menu button{touch-action:pan-y}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.choices button{text-align:left}.choices button.selected{background:#236e7c;border-color:#a2f6ff}.primary{width:100%;margin-top:10px;background:#20768a}small{color:#b7d0d5}h1{margin:0 0 8px;font-size:26px}.notice{color:#f7d796}@media(max-height:500px){.stick{width:95px;height:95px;bottom:10px}.stick i{width:40px;height:40px}#aux{bottom:115px}#status{font-size:11px}#map{width:110px;height:66px}.menu{padding:12px}}
</style></head><body><canvas id="field"></canvas><div id="hud" hidden><div class="box" id="status"></div><div class="box" id="objective"></div><div id="actions"><button id="pause">Ⅱ</button><button id="sound">🔊</button></div><canvas id="map" width="300" height="180" title="Карта аэродрома"></canvas><div class="box" id="message" hidden></div><div id="aux"><button id="tow">СЦЕПКА</button><button id="service">АНГАР</button></div><div id="move" class="stick"><i></i></div><div id="fire" class="stick"><i>✚</i></div></div><div id="panel"><div class="menu" id="menu"></div></div><script src="airport-mission.js"></script><script src="airport-game.js"></script></body></html>
